[project]
name = "gt-telemetry"
version = "0.0.0"
description = "Local Gran Turismo 7 telemetry"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.scripts]
gt-telemetry = "gt_telemetry.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
